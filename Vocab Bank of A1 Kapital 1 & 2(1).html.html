            if (card.t.includes("Greeting") || card.t.includes("Phrase") || card.t.includes("Particle")) tagColor = "bg-indigo-100 text-indigo-800 border-indigo-200";
            if (card.t.includes("Numeral")) tagColor = "bg-cyan-100 text-cyan-800 border-cyan-200";

            return `

                            </div>
                            <button onclick="playAudio('${card.d.replace(/['"]+/g, '')}', event)" class="audio-btn mt-4 absolute bottom-4 right-4" title="Listen to Pronunciation">
                                <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M9.383 3.076A1 1 0 0110 4v12a1 1 0 01-1.707.707L4.586 13H2a1 1 0 01-1-1V8a1 1 0 011-1h2.586l3.707-3.707a1 1 0 011.09-.217zM14.657 2.929a1 1 0 011.414 0A9.972 9.972 0 0119 10a9.972 9.972 0 01-2.929 7.071 1 1 0 01-1.414-1.414A7.971 7.971 0 0017 10c0-2.21-.894-4.208-2.343-5.657a1 1 0 010-1.414zm-2.829 2.828a1 1 0 011.415 0A5.983 5.983 0 0115 10a5.984 5.984 0 01-1.757 4.243 1 1 0 01-1.415-1.415A3.984 3.984 0 0013 10a3.983 3.983 0 00-1.172-2.828 1 1 0 010-1.415z" clip-rule="evenodd"></path></svg>
                            </button>
                        </div>
                        <div class="flip-card-back absolute w-full h-full backface-hidden rotate-y-180 notebook-bg border-b-4 border-emerald-500 rounded-2xl p-5 flex flex-col items-center justify-start overflow-y-auto custom-scrollbar">
                            <div class="absolute top-4 left-4"><span class="${tagColor} text-xs font-bold px-2.5 py-1 rounded shadow-sm border uppercase tracking-wider">${card.t}</span></div>
                            <div class="w-full text-center mt-8 mb-4">
                                <h4 class="text-2xl font-bold text-emerald-700 mb-1 font-handwriting tracking-wide leading-tight">${card.e}</h4>
                                <p class="text-gray-600 font-bold text-sm md:text-base border-b border-gray-200 pb-2">${card.h}</p>
                            </div>
                            <div class="w-full space-y-3 text-left px-1 pb-4">
                                <div class="bg-white/90 p-2.5 rounded-lg shadow-sm border border-gray-100">
                                    <p class="font-bold text-gray-800 text-sm">🇩🇪 ${card.ex1.d}</p>
                                    <p class="text-gray-600 text-xs mt-1">🇬🇧 ${card.ex1.e}</p>
                                    <p class="text-emerald-700 font-semibold text-[11px] mt-1">🇮🇳 ${card.ex1.h}</p>
                                </div>
                                <div class="bg-white/90 p-2.5 rounded-lg shadow-sm border border-gray-100">
                                    <p class="font-bold text-gray-800 text-sm">🇩🇪 ${card.ex2.d}</p>
                                    <p class="text-gray-600 text-xs mt-1">🇬🇧 ${card.ex2.e}</p>
                                    <p class="text-emerald-700 font-semibold text-[11px] mt-1">🇮🇳 ${card.ex2.h}</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function calculateStats() {
            let stats = {
                total: 0, nouns: 0, verbs: 0, adjectives: 0, adverbs: 0, pronouns: 0,
                prepositions: 0, conjunctions: 0, articles: 0, numerals: 0, phrases: 0, instructions: 0,
                regularVerbs: 0, irregularVerbs: 0, mixedVerbs: 0, separableVerbs: 0, inseparableVerbs: 0
            };

            bookData.forEach(section => {
                section.cards.forEach(card => {
                    stats.total++;
                    const t = card.t.toLowerCase();
                    const i = card.i.toLowerCase();
                    
                    if(t.includes('noun')) stats.nouns++;
                    if(t.includes('verb')) {
                        stats.verbs++;
                        if(i.includes('regular')) stats.regularVerbs++;
                        if(i.includes('irreg')) stats.irregularVerbs++;
                        if(i.includes('mixed')) stats.mixedVerbs++;
                        if(i.includes('sep.')) stats.separableVerbs++;
                        if(i.includes('insep.')) stats.inseparableVerbs++;
                    }
                    if(t.includes('adjective')) stats.adjectives++;
                    if(t.includes('adverb')) stats.adverbs++;
                    if(t.includes('pronoun')) stats.pronouns++;
                    if(t.includes('preposition')) stats.prepositions++;
                    if(t.includes('conjunction')) stats.conjunctions++;
                    if(t.includes('article')) stats.articles++;
                    if(t.includes('numeral')) stats.numerals++;
                    if(t.includes('phrase') || t.includes('greeting') || t.includes('question')) stats.phrases++;
                    if(t.includes('instruction')) stats.instructions++;
                });
            });

            document.getElementById('generalStats').innerHTML = `
                <div class="stat-card cursor-pointer hover:bg-blue-50" onclick="document.getElementById('searchBar').value=''; renderFlashcards('');"><div class="text-3xl font-black text-blue-600">${stats.total}</div><div class="text-[10px] font-bold text-gray-500 uppercase">Total Words</div></div>
                <div class="stat-card cursor-pointer hover:bg-blue-50" onclick="document.getElementById('searchBar').value='noun'; renderFlashcards('noun');"><div class="text-3xl font-black text-blue-600">${stats.nouns}</div><div class="text-[10px] font-bold text-gray-500 uppercase">Nouns</div></div>
                <div class="stat-card cursor-pointer hover:bg-blue-50" onclick="document.getElementById('searchBar').value='verb'; renderFlashcards('verb');"><div class="text-3xl font-black text-blue-600">${stats.verbs}</div><div class="text-[10px] font-bold text-gray-500 uppercase">Verbs</div></div>
                <div class="stat-card cursor-pointer hover:bg-blue-50" onclick="document.getElementById('searchBar').value='adjective'; renderFlashcards('adjective');"><div class="text-3xl font-black text-blue-600">${stats.adjectives}</div><div class="text-[10px] font-bold text-gray-500 uppercase">Adjectives</div></div>
                <div class="stat-card cursor-pointer hover:bg-blue-50" onclick="document.getElementById('searchBar').value='adverb'; renderFlashcards('adverb');"><div class="text-3xl font-black text-blue-600">${stats.adverbs}</div><div class="text-[10px] font-bold text-gray-500 uppercase">Adverbs</div></div>
                <div class="stat-card cursor-pointer hover:bg-blue-50" onclick="document.getElementById('searchBar').value='pronoun'; renderFlashcards('pronoun');"><div class="text-3xl font-black text-blue-600">${stats.pronouns}</div><div class="text-[10px] font-bold text-gray-500 uppercase">Pronouns</div></div>
                <div class="stat-card cursor-pointer hover:bg-blue-50" onclick="document.getElementById('searchBar').value='preposition'; renderFlashcards('preposition');"><div class="text-3xl font-black text-blue-600">${stats.prepositions}</div><div class="text-[10px] font-bold text-gray-500 uppercase">Prepositions</div></div>
                <div class="stat-card cursor-pointer hover:bg-blue-50" onclick="document.getElementById('searchBar').value='phrase'; renderFlashcards('phrase');"><div class="text-3xl font-black text-blue-600">${stats.phrases}</div><div class="text-[10px] font-bold text-gray-500 uppercase">Phrases/Greetings</div></div>
            `;

            document.getElementById('verbStats').innerHTML = `
                <div class="stat-card border-red-500 cursor-pointer hover:bg-red-50" onclick="document.getElementById('searchBar').value='regular'; renderFlashcards('regular');"><div class="text-3xl font-black text-red-600">${stats.regularVerbs}</div><div class="text-[10px] font-bold text-gray-500 uppercase">Regular</div></div>
                <div class="stat-card border-red-500 cursor-pointer hover:bg-red-50" onclick="document.getElementById('searchBar').value='irreg'; renderFlashcards('irreg');"><div class="text-3xl font-black text-red-600">${stats.irregularVerbs}</div><div class="text-[10px] font-bold text-gray-500 uppercase">Irregular</div></div>
                <div class="stat-card border-red-500 cursor-pointer hover:bg-red-50" onclick="document.getElementById('searchBar').value='sep.'; renderFlashcards('sep.');"><div class="text-3xl font-black text-red-600">${stats.separableVerbs}</div><div class="text-[10px] font-bold text-gray-500 uppercase">Separable</div></div>
                <div class="stat-card border-red-500 cursor-pointer hover:bg-red-50" onclick="document.getElementById('searchBar').value='insep.'; renderFlashcards('insep.');"><div class="text-3xl font-black text-red-600">${stats.inseparableVerbs}</div><div class="text-[10px] font-bold text-gray-500 uppercase">Inseparable</div></div>
            `;
        }

        function renderFlashcards(filterText = "") {
            container.innerHTML = "";
            let matchCount = 0;
            const term = filterText.toLowerCase();

            bookData.forEach(section => {
                const filteredCards = section.cards.filter(card => {
                    if (!term) return true;
                    const searchStr = `${card.d} ${card.e} ${card.h} ${card.t} ${card.i} ${card.ex1.d} ${card.ex2.d}`.toLowerCase();
                    return searchStr.includes(term);
                });

                if (filteredCards.length > 0) {
                    matchCount += filteredCards.length;
                    let sectionHTML = `
                        <div class="mb-12 pl-2 md:pl-4">
                            <h3 class="text-2xl md:text-3xl font-bold text-blue-600 mb-6 flex items-center border-b-2 border-blue-100 pb-2">
                                <span class="bg-blue-100 text-blue-700 w-10 h-10 rounded-full flex items-center justify-center mr-3 text-lg">📚</span>
                                ${section.title}
                            </h3>
                            <div class="flashcard-grid">
                                ${filteredCards.map((card, idx) => generateCardHTML(card, idx)).join('')}
                            </div>
                        </div>
                    `;
                    container.innerHTML += sectionHTML;
                }
            });

            const noResults = document.getElementById('noResults');
            if (matchCount === 0) noResults.classList.remove('hidden');
            else noResults.classList.add('hidden');
            
            calculateStats();
        }

        function playAudio(text, event) {
            event.stopPropagation();
            let cleanText = text.replace(/, -n|, -en|, -e|, -s|, -|"er|"e|"en|\(.*\)/g, '').trim();
            const utterance = new SpeechSynthesisUtterance(cleanText);
            utterance.lang = 'de-DE';
            utterance.rate = 0.85; 
            window.speechSynthesis.speak(utterance);
        }

        const searchBar = document.getElementById('searchBar');
        const clearBtn = document.getElementById('clearSearch');

        searchBar.addEventListener('input', (e) => {
            const val = e.target.value;
            renderFlashcards(val);
            if (val.length > 0) clearBtn.classList.remove('hidden');
            else clearBtn.classList.add('hidden');
        });

        clearBtn.addEventListener('click', () => {
            searchBar.value = '';
            renderFlashcards('');
            clearBtn.classList.add('hidden');
            searchBar.focus();
        });

        renderFlashcards();
    </script>
</body>
</html>
